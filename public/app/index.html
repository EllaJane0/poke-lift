*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}

.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--fg2)} .faint{color:var(--fg3)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.b{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;background:var(--sunk);color:var(--fg);white-space:nowrap}

.btn.ok{background:var(--ok);color:#fff}

.btn.sm{height:32px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.wide{width:100%;height:48px;font-size:16px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:var(--sunk);font-size:13px;font-weight:500}
.tp{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:5px;color:#fff;text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .5s ease}
.hp>i{background:var(--ok)} .hp.mid>i{background:#d9a400} .hp.low>i{background:var(--red)}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;text-align:left}

.chev{color:var(--fg3);font-size:18px}

label.l{display:block;font-size:13px;color:var(--fg2);margin:12px 0 6px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg2)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg3)}
.tabs button.on{color:var(--red)}
.tabs svg{width:24px;height:24px}
.resume{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:29;display:flex;justify-content:center;pointer-events:none;padding:0 12px 8px}
.resume button{pointer-events:auto;max-width:496px;width:100%;height:46px;border-radius:12px;background:var(--red);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
/* layers */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease}

.sheet h3{font-size:19px;margin:4px 0 12px}
.center{text-align:center}

@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sprite */
.spr{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.spr img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.spr .fb{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:-.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.egg{width:34px;height:44px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;position:relative;border:2px solid rgba(0,0,0,.12)}

function gymUnlocked(i) { return i === 0 || !!G_().badges["g" + (i - 1)]; }
function oppUnlocked(i, j) { return gymUnlocked(i) && (j === 0 || (G_().beaten[i + "-" + (j - 1)] || 0) > 0); }
function currentGym() { let i = 0; while (i < 7 && G_().badges["g" + i]) i++; return i; }
function addMon(m) {
  const g = G_(); g.mons[m.uid] = m; if (!g.dex.includes(m.sp)) g.dex.push(m.sp);
  if (g.party.length < 6) g.party.push(m.uid);

/* ---------- walking ---------- */
const W_ = () => G_().walk;
function prsSince(t) { return S.sessions.reduce((n, s) => n + (s.end > (t || 0) ? (s.prs || 0) : 0), 0); }
/* encounters already given; older saves counted one per 10k day */
const givenOf = w => (w.given != null ? w.given : Object.keys(w.claimed || {}).length);
function walkStatus() {
  const w = W_(), today = dk(); const total = PL.totalSteps(w.days, w.start); const given = givenOf(w);
  const since = Math.max(0, total - given * PL.STEP_GOAL);
  const prs = prsSince(w.shinyAt);
  return { today, steps: w.days[today] || 0, total, given, since, toGo: Math.max(0, PL.STEP_GOAL - since), prs, shiny: PL.shinyChance(prs) };
}
/* Every 10,000 steps walked in total (across any number of days) brings one encounter. */
function processWalk() {
  if (!S.core || !G_().started) return false;
  const w = W_(); if (w.given == null) w.given = givenOf(w);
  const earned = Math.floor(PL.totalSteps(w.days, w.start) / PL.STEP_GOAL); let changed = false;
  while (w.given < earned) {
    const m = PL.rollEncounter({ levels: Object.values(G_().mons).map(x => x.lv), prs: prsSince(w.shinyAt) });
    w.given += 1; m.total = w.given * PL.STEP_GOAL; w.pending.push(m); if (m.shiny) w.shinyAt = Date.now(); changed = true;
  }
  if (changed) saveCore();
  return changed;
}
function acceptEncounter() {
  const w = W_(); const m = w.pending.shift(); if (!m) return null;
  const full = G_().party.length >= 6;
  delete m.day; delete m.steps; delete m.total; delete m.wild; delete m.pool; delete m.fromEgg; m.got = Date.now();
  addMon(m); saveCore(); return { m, full };
}

async function refreshSteps() {
  if (MODE === "cloud" && R.sb && S.auth.uid && !stepsBusy) {
    stepsBusy = true;
    try {
      const since = PL.addDay(dk(), -30);
      const r = await R.sb.from("pokelift_steps").select("day,steps,source,updated_at").gte("day", since);
      if (!r.error && S.core) { const w = W_(); let ch = false;
        for (const row of r.data) { if ((w.days[row.day] || 0) < row.steps) { w.days[row.day] = row.steps; ch = true; }
          if (row.source === "shortcut") { const t = Date.parse(row.updated_at); if (t > (w.lastSync || 0)) { w.lastSync = t; ch = true; } } }
        if (ch) saveCore(); }
    } catch (e) {}
    stepsBusy = false;
  }
  processWalk(); rerender();
}
function setSteps(day, n) {
  const w = W_(); w.days[day] = Math.max(0, Math.min(200000, Math.round(n))); saveCore();

}

function setStr(e, s) {
  if (!s) return "";
  if (e.kind === "time") return `${s.r || 0}s`;
  if (e.kind === "distance") return `${s.r || 0} mi`;
  if (e.kind === "bw") return (+s.w ? `+${s.w}` : "BW") + ` × ${s.r}`;
  return `${s.w || 0} × ${s.r}`;
}
function ExerciseHistory({ id }) {
  const e = ex(id); const rows = history()[id] || [];
  const load = (s, bw) => PL.setLoad(e, s, bw);
  const pts = [...rows].reverse().map(r => ({ d: r.date, v: Math.max(0, ...r.sets.map(s => PL.e1rm(load(s, r.bw), +s.r || 0))) })).filter(p => p.v > 0);
  let best = null; for (const r of rows) for (const s of r.sets) { const v = PL.e1rm(load(s, r.bw), +s.r || 0); if (!best || v > best.v) best = { v, s, d: r.date }; }
  const W = 320, H = 120, P = 6;
  const mn = pts.length ? Math.min(...pts.map(p => p.v)) : 0, mx = pts.length ? Math.max(...pts.map(p => p.v)) : 1;
  const xy = (p, i) => [P + (pts.length > 1 ? i / (pts.length - 1) : .5) * (W - 2 * P), H - P - (mx === mn ? .5 : (p.v - mn) / (mx - mn)) * (H - 2 * P)];
  const path = pts.map((p, i) => (i ? "L" : "M") + xy(p, i).map(n => n.toFixed(1)).join(" ")).join("");
  const isLoad = e.kind === "weight" || e.kind === "bw";
  return html`<${Sheet} title=${e.name}>
    <div class="row" style="gap:8px;margin-top:-6px;margin-bottom:12px"><span class="chip">${e.muscle || "Exercise"}</span>${e.kind === "bw" && html`<span class="chip">Bodyweight ${Math.round(e.mod * 100)}%</span>`}
      <span class="grow"></span><button class="btn sm" onClick=${() => openSheet(NewExercise, { id })}>Edit</button></div>
    ${isLoad && best && html`<div class="stat-grid" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="k">Best set</div><div class="v">${setStr(e, best.s)}</div><div class="tiny muted">${fmtDate(best.d)}</div></div>
      <div class="tile"><div class="k">Est. 1-rep max</div><div class="v">${Math.round(best.v)}<span class="small muted"> lb</span></div><div class="tiny muted">Epley formula</div></div></div>`}
    ${isLoad && pts.length > 1 && html`<h2 class="sec">Est. 1RM over time</h2><div class="card" style="padding:10px"><svg viewBox=${`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Estimated one-rep max trend">
      <path d=${path + `L${xy(pts[pts.length - 1], pts.length - 1)[0]} ${H}L${P} ${H}Z`} fill="var(--blue)" opacity=".1"/><path d=${path} fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${(() => { const [x, y] = xy(pts[pts.length - 1], pts.length - 1); return html`<circle cx=${x} cy=${y} r="4" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>`; })()}</svg>
      <div class="row tiny muted num"><span class="grow">${fmtDate(pts[0].d, { month: "short", day: "numeric" })} · ${Math.round(mn)} lb</span><span>${Math.round(mx)} lb</span></div></div>`}
    <h2 class="sec">History</h2>
    ${rows.length ? html`<div class="list">${rows.map(r => html`<div class="li" style="align-items:flex-start"><div class="small b" style="width:84px;flex:none">${fmtDate(r.date, { month: "short", day: "numeric" })}</div>
      <div class="grow small num">${r.all.map(s => html`<span class="chip" style=${"margin:0 4px 4px 0;" + (s.warm ? "opacity:.6" : "")}>${s.warm ? "W " : ""}${setStr(e, s)}</span>`)}</div></div>`)}</div>`
      : html`<div class="card empty small">No sets logged yet.</div>`}<//>`;
}

        <button class="btn sm" style="margin-top:8px" onClick=${() => upd(() => { const p = it.sets[it.sets.length - 1]; it.sets.push({ w: p ? p.w : "", r: p ? p.r : "", warm: false, done: true }); })}>+ Set</button></div>`; })}</div>

/* ---------------- growth prompts (learn move / evolve) ---------------- */
function PromptLayer() {
  if (U.layer === "finish" || U.layer === "battle" || U.sheets.length) return null;
  if (G_().started && W_().pending.length) return html`<${EncounterPrompt} />`;
  const q = U.queue[0]; if (!q) return null;
  const m = monOf(q.uid); if (!m && q.k !== "msg") { U.queue.shift(); setTimeout(go); return null; }
  const next = () => { U.queue.shift(); saveCore(); go(); };
  let body;
  if (q.k === "msg") body = html`<div class="center">${q.sp && html`<${Sprite} sp=${q.sp} size=${120} />`}<h3>${q.title}</h3><p class="muted">${q.body}</p></div><button class="btn pri wide" onClick=${next}>OK</button>`;
  else if (q.k === "learn") { const mv = PL.move(q.move);
    body = html`<div class="row" style="margin-bottom:6px"><${Sprite} sp=${m.sp} size=${56} /><h3 class="grow" style="margin:0">${monName(m)} wants to learn ${mv.n}</h3></div>
      <div class="card row small" style="margin-bottom:12px"><${TypePill} t=${mv.t} /><span class="grow">${mv.p ? `Power ${mv.p}` : "Status move"} · Acc ${mv.a || "—"} · PP ${mv.pp}</span></div>
      ${m.moves.length < 4 ? html`<button class="btn pri wide" onClick=${() => { m.moves.push(q.move); next(); }}>Learn ${mv.n}</button>` : html`
      <div class="small muted" style="margin-bottom:6px">Choose a move to forget:</div>
      <div class="list">${m.moves.map((id, i) => { const o = PL.move(id); return html`<button class="li" onClick=${() => { m.moves[i] = q.move; toast(`Forgot ${o.n}, learned ${mv.n}`); next(); }}><${TypePill} t=${o.t} /><div class="grow b">${o.n}</div><span class="small muted num">${o.p || "—"}</span></button>`; })}</div>`}
      <button class="btn wide" style="margin-top:10px" onClick=${next}>Don't learn ${mv.n}</button>`; }
  else if (q.k === "evo") { const opts = PL.evoOptions(m);
    if (!opts.length) { U.queue.shift(); setTimeout(go); return null; }
    const doEvo = to => { const from = monName(m); const nickless = !m.nick; const r = PL.evolve(m, to); U.queue.shift();
      const extra = r.pending.map(mv => ({ k: "learn", uid: m.uid, move: mv }));
      U.queue.unshift({ k: "msg", sp: to, title: "Congratulations!", body: `${from} evolved into ${PL.mon(to).n}!${r.learned.length ? " It learned " + r.learned.map(x => PL.move(x).n).join(", ") + "." : ""}` }, ...extra);
      if (PL.evoOptions(m).length) U.queue.splice(1 + extra.length, 0, { k: "evo", uid: m.uid });
      if (nickless) {} saveCore(); go(); };
    body = html`<div class="center"><${Sprite} sp=${m.sp} size=${120} /><h3>What? ${monName(m)} is evolving!</h3>
      <p class="muted small">${opts[0].how === "stone" ? `In the games this needs an evolution stone. Here it happens at Lv ${opts[0].lv}.` : opts[0].how === "trade" ? `In the games this needs a trade. Here it happens at Lv ${opts[0].lv}.` : ""}</p></div>
      ${opts.length > 1 ? html`<div class="small muted center" style="margin-bottom:8px">Choose its evolution:</div><div class="row" style="gap:8px">${opts.map(o => html`<button class="card grow center" onClick=${() => doEvo(o.to)}><${Sprite} sp=${o.to} size=${64} /><div class="b small">${PL.mon(o.to).n}</div></button>`)}</div>`
        : html`<button class="btn pri wide" onClick=${() => doEvo(opts[0].to)}>Evolve into ${PL.mon(opts[0].to).n}</button>`}
      <button class="btn wide" style="margin-top:10px" onClick=${() => { m.evoNo = m.lv; next(); }}>Stop evolution</button>`; }
  return html`<div class="scrim" style="z-index:80"><div class="sheet"><div class="grab"></div>${body}</div></div>`;
}

function startBattle(i, j) {
  const g = G_(); const order = [g.active, ...g.party.filter(u => u !== g.active)].map(monOf).filter(Boolean);
  if (!order.length) { toast("Add a Pokémon to your party first"); return; }
  const B = PL.newBattle(order, i, j);
  U.battle = { B, view: snapOf(B), msg: `${B.foe} wants to battle! ${B.foe.split(" ").slice(-1)[0]} sent out ${B.theirs[0].name}.`, playing: false, phase: "choose", sub: null };
  U.layer = "battle"; closeAll();
}
const snapOf = B => ({ a: B.a, b: B.b, mine: B.mine.map(m => [m.hp, m.status]), theirs: B.theirs.map(m => [m.hp, m.status]) });
let playT = null;
function playEvents(ev) {
  const bt = U.battle; bt.playing = true; bt.phase = "play"; bt.q = ev.slice();
  const step = () => { if (!U.battle) return; const e = bt.q.shift();
    if (!e) { bt.playing = false; bt.view = snapOf(bt.B); afterTurn(); go(); return; }
    bt.view = e.snap; bt.msg = e.msg; go(); playT = setTimeout(step, 900); };
  bt.skip = () => { clearTimeout(playT); step(); };
  step();
}
function afterTurn() {
  const bt = U.battle, B = bt.B;
  if (B.over) { bt.phase = "over"; rewardBattle(); return; }
  if (B.mine[B.a].fainted) { bt.phase = "switch"; bt.msg = "Choose your next Pokémon."; return; }
  bt.phase = "choose"; bt.msg = `What will ${B.mine[B.a].name} do?`;
}
function rewardBattle() {
  const bt = U.battle, B = bt.B; if (bt.rewarded) return; bt.rewarded = true;
  const g = G_(); const gy = PL.GYMS[B.gymIdx]; const opp = gy.ladder[B.oppIdx];
  if (B.over === "win") {
    const key = B.gymIdx + "-" + B.oppIdx; const first = !g.beaten[key]; const lv = PL.TRAINER_LV[opp.tier]; const res = [];
    mutate(() => { g.beaten[key] = (g.beaten[key] || 0) + 1;
      /* first win only: a little XP, split like a workout (active gets it all, party gets the share) */
      if (first) for (const uid of g.party) { const m = monOf(uid); if (!m) continue;
        const frac = uid === g.active ? 1 : S.core.settings.share; const r = PL.awardXP(m, PL.levelsToXP(m, lv * frac)); queueGrowth(m, r); res.push({ m, lv: lv * frac, r }); }
      if (opp.tier === "leader" && !g.badges["g" + B.gymIdx]) { g.badges["g" + B.gymIdx] = Date.now(); g.bank += gy.lv; g.bankLog.push({ d: Date.now(), amt: gy.lv, why: gy.badge + " Badge" }); bt.badge = true; } });
    bt.reward = { first, res };
  } else bt.insight = PL.lossInsight(B);
}
function Battle() {
  const bt = U.battle; if (!bt) return null; const B = bt.B, v = bt.view;
  const me = B.mine[v.a], foe = B.theirs[v.b];
  const [mhp, mst] = v.mine[v.a], [fhp, fst] = v.theirs[v.b];
  const hpCls = p => p > .5 ? "hp" : p > .2 ? "hp mid" : "hp low";
  const stTag = s => s ? html`<span class="tp" style="background:#777;margin-left:6px">${{ par: "PAR", slp: "SLP", frz: "FRZ", brn: "BRN", psn: "PSN" }[s]}</span>` : null;
  const act = a => { const ev = PL.runTurn(B, a); playEvents(ev); };
  const exit = () => { clearTimeout(playT); U.battle = null; U.layer = null; go(); };
  const cur = B.mine[B.a]; const forced = cur.recharge || cur.charging; const usable = cur.moves.filter(x => x.pp > 0);
  const party = (arr, side) => html`<div class="row" style="gap:3px">${arr.map((m, i) => html`<i style=${`width:8px;height:8px;border-radius:50%;display:inline-block;background:${(side === "me" ? v.mine : v.theirs)[i][0] > 0 ? "var(--ok)" : "var(--fg3)"}`}></i>`)}</div>`;

  return html`<div class="app"><${View} /></div>
    ${S.active && U.layer !== "logger" && html`<div class="resume"><button onClick=${() => { U.layer = "logger"; go(); }}><span>Resume ${S.active.name}</span><span class="num">${fmtDur(Date.now() - S.active.start)}</span></button></div>`}
    <nav class="tabs"><div class="in">${tabs.map(([k, l, ic]) => html`<button class=${U.tab === k ? "on" : ""} aria-current=${U.tab === k ? "page" : null} onClick=${() => { U.tab = k; window.scrollTo(0, 0); go(); }}>${ic}<span>${l}</span></button>`)}</div></nav>
    ${U.layer === "logger" && html`<${Logger} />`}
    ${U.layer === "finish" && html`<${Finish} />`}
    ${U.layer === "battle" && html`<${Battle} />`}
    <${PromptLayer} />
    ${U.sheets.length > 0 && html`<${SheetHost} />`}
    ${U.toast && html`<div class="toast" role="status">${U.toast}</div>`}`;
}
function SheetHost() {
  const top = U.sheets[U.sheets.length - 1]; const C = top.C;
  return html`<div class="scrim" onClick=${e => { if (e.target === e.currentTarget) closeSheet(); }}><div class="sheet" role="dialog"><${C} key=${top.id} ...${top.p} /></div></div>`;
}
render(html`<${App} />`, document.getElementById("root"));

</script>
</body></html>
